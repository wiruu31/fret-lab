<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0C2F57"/><stop offset="1" stop-color="#0A0E2B"/></linearGradient>
    <radialGradient id="g1" cx="0.12" cy="0.1" r="0.7"><stop offset="0" stop-color="#38BDF8" stop-opacity=".38"/><stop offset="1" stop-color="#38BDF8" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx="0.95" cy="1" r="0.75"><stop offset="0" stop-color="#6366F1" stop-opacity=".5"/><stop offset="1" stop-color="#6366F1" stop-opacity="0"/></radialGradient>
    <linearGradient id="nt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A5E4FF"/><stop offset=".5" stop-color="#38BDF8"/><stop offset="1" stop-color="#6D7BFF"/></linearGradient>
    <linearGradient id="kilau" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <clipPath id="k"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#k)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#g1)"/>
    <rect width="512" height="512" fill="url(#g2)"/>
    <!-- senar halus di latar -->
    <g stroke="#7DD3FC" stroke-opacity=".10" stroke-width="3">
      <line x1="0" y1="120" x2="512" y2="120"/><line x1="0" y1="190" x2="512" y2="190"/><line x1="0" y1="260" x2="512" y2="260"/>
      <line x1="0" y1="330" x2="512" y2="330"/><line x1="0" y1="400" x2="512" y2="400"/><line x1="0" y1="470" x2="512" y2="470"/>
    </g>
    <!-- not balok (beamed notes) -->
    <g>
      <polygon points="208,150 392,104 392,184 208,230" fill="url(#nt)"/>
      <rect x="196" y="150" width="26" height="206" rx="6" fill="url(#nt)"/>
      <rect x="380" y="104" width="26" height="206" rx="6" fill="url(#nt)"/>
      <ellipse cx="162" cy="362" rx="62" ry="48" transform="rotate(-22 162 362)" fill="url(#nt)"/>
      <ellipse cx="346" cy="316" rx="62" ry="48" transform="rotate(-22 346 316)" fill="url(#nt)"/>
      <polygon points="208,150 392,104 392,128 208,174" fill="url(#kilau)"/>
      <ellipse cx="148" cy="350" rx="22" ry="12" transform="rotate(-22 148 350)" fill="#fff" fill-opacity=".28"/>
      <ellipse cx="332" cy="304" rx="22" ry="12" transform="rotate(-22 332 304)" fill="#fff" fill-opacity=".28"/>
    </g>
