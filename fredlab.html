<!DOCTYPE html>
<html lang="id" data-tema="gelap">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FredLab</title>
  <meta name="description" content="FredLab: pustaka chord, tuner, dan chord + lirik untuk main gitar dan ukulele.">
  <meta name="theme-color" content="#0E0F12">
  <meta name="color-scheme" content="dark light">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="FredLab">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="fredlab.css">
</head>
<body>

  <!-- HEADER START -->
  <header class="app-header">
    <button type="button" class="back-btn" id="btnKembali" data-aksi="lagu-kembali" aria-label="Kembali ke daftar lagu" hidden>&lsaquo;</button>
    <h1 class="app-title">
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l11-2v13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6" cy="18" r="3" fill="currentColor"/><circle cx="17" cy="16" r="3" fill="currentColor"/></svg>
      <span id="judulHalaman">Chord</span>
    </h1>
    <span class="app-versi muted">FredLab v1.0.0</span>
  </header>
  <!-- HEADER END -->

  <!-- ISI HALAMAN START -->
  <main class="app-main">
    <section class="view is-active" id="view-chord" aria-label="Chord"><div id="isi-chord"></div></section>
    <section class="view" id="view-tuner" aria-label="Tuner"><div id="isi-tuner"></div></section>
    <section class="view" id="view-lagu" aria-label="Lagu"><div id="isi-lagu"></div></section>
    <section class="view" id="view-pengaturan" aria-label="Pengaturan"><div id="isi-pengaturan"></div></section>

    <!-- FOOTER START -->
    <footer class="app-footer">
      <p>&copy; <span id="tahunCopyright">2026</span> Muh Geris Wiruno Mandawa. Semua hak dilindungi.</p>
      <p>Data tersimpan di perangkat ini saja.</p>
    </footer>
    <!-- FOOTER END -->
  </main>
  <!-- ISI HALAMAN END -->

  <button type="button" class="fab" id="fabTambah" data-aksi="fab" aria-label="Tambah lagu" hidden>+</button>

  <!-- NAVIGASI START -->
  <nav class="bottom-nav" aria-label="Menu utama">
    <button type="button" class="nav-btn is-active" data-aksi="tab" data-tab="chord" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9 3v18M15 3v18M5 9h14M5 15h14" stroke="currentColor" stroke-width="1.4" fill="none"/></svg>
      <span>Chord</span></button>
    <button type="button" class="nav-btn" data-aksi="tab" data-tab="tuner" aria-current="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17a8 8 0 0 1 16 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M12 17l4-6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="17" r="1.6" fill="currentColor"/></svg>
      <span>Tuner</span></button>
    <button type="button" class="nav-btn" data-aksi="tab" data-tab="lagu" aria-current="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l10-2v13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="16.5" cy="16" r="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
      <span>Lagu</span></button>
    <button type="button" class="nav-btn" data-aksi="tab" data-tab="pengaturan" aria-current="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" fill="none"/><circle cx="16" cy="7" r="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="8" cy="17" r="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
      <span>Pengaturan</span></button>
  </nav>
  <!-- NAVIGASI END -->

  <!-- DIALOG START -->
  <dialog class="sheet" id="dialogChord" aria-label="Detail chord">
    <div id="isiChord"></div>
  </dialog>

  <dialog class="sheet" id="dialogUmum" aria-labelledby="judulUmum">
    <form id="formUmum" method="dialog">
      <h2 class="sheet-title" id="judulUmum"></h2>
      <p class="hint" id="infoUmum" hidden></p>
      <div id="isiUmum"></div>
      <div class="sheet-actions">
        <button type="button" class="btn btn--danger" id="btnHapusUmum" data-aksi="hapus-umum" hidden>hapus</button>
        <button type="button" class="btn" data-aksi="tutup-dialog">batal</button>
        <button type="submit" class="btn btn--solid" id="btnSimpanUmum">simpan</button>
      </div>
    </form>
  </dialog>
  <!-- DIALOG END -->

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="inputImpor" accept="application/json,.json" hidden>

  <script src="data.js"></script>
  <script src="storage.js"></script>
  <script src="audio.js"></script>
  <script src="ui.js"></script>
  <script src="halaman.js"></script>
  <script src="app.js"></script>
</body>
</html>
